<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MMCP app icon</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #000; }
      body { display: grid; place-items: center; }
      .tile {
        width: 1024px;
        height: 1024px;
        display: grid;
        place-items: center;
        background: #0b0d0d;
        border-radius: 224px;
      }
      img { width: 610px; height: auto; display: block; }
    </style>
  </head>
  <body>
    <main class="tile" aria-label="MMCP app icon">
      <img src="../Logo%20Mark%20(MM%20Filled).svg" alt="MMCP" />
    </main>
  </body>
</html>
