<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multi-MCP icon</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #000; }
      body { display: grid; place-items: center; }
      .tile {
        width: 1024px;
        height: 1024px;
        display: grid;
        place-items: center;
        background: #080808;
        border-radius: 224px;
      }
      svg { width: 100%; height: 100%; }
      .mark { fill: none; stroke: #f5f5f2; stroke-width: 58; stroke-linecap: square; stroke-linejoin: miter; }
    </style>
  </head>
  <body>
    <main class="tile" aria-label="Multi-MCP monogram icon">
      <svg viewBox="0 0 1024 1024" role="img" aria-label="Abstract MMCP monogram">
        <!-- Two interlocking M forms establish the multi-account motif. -->
        <path class="mark" d="M135 714V330L255 504L375 330V714" />
        <path class="mark" d="M360 714V330L480 504L600 330V714" />

        <!-- C and P share the same vertical stem: compact, connected, and legible. -->
        <path class="mark" d="M836 399C791 352 715 343 658 378C602 413 582 489 608 553C634 618 706 650 768 626" />
        <path class="mark" d="M778 714V352H845C907 352 938 393 938 454C938 515 907 554 845 554H778" />
      </svg>
    </main>
  </body>
</html>
